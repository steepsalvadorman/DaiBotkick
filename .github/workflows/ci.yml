name: Validate DaiBot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daibot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/daibot_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: clippy,rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path backend/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path backend/Cargo.toml --locked
      - run: cargo test --manifest-path backend/Cargo.toml --locked -- --ignored
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash tests/backup_restore.sh
      - run: node --test tests/overlay.test.cjs
      - run: docker build -t daibot:ci .
      - name: Start the built image against the test database
        run: >-
          docker run --detach --rm --name daibot-smoke --network host
          -e DATABASE_URL="$TEST_DATABASE_URL"
          -e KICK_CLIENT_ID=fixture -e KICK_CLIENT_SECRET=fixture
          -e BASE_URL=http://127.0.0.1:3000 daibot:ci
      - name: Verify the running image
        run: |
          test "$(docker exec daibot-smoke id -u)" = 10001
          docker exec daibot-smoke python3 -c "from importlib.metadata import version; assert version('edge-tts') == '7.2.8'"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/readyz; then break; fi
            sleep 1
          done
          node --test tests/runtime.test.cjs
      - name: Collect image logs and stop the test container
        if: always()
        run: |
          docker logs daibot-smoke || true
          docker stop daibot-smoke || true
