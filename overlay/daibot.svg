<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="crx-title crx-desc">
  <title id="crx-title">DaiBot, ninja veloz electrónico y programador</title>
  <desc id="crx-desc">Emblema gamer original: busto de ninja cibernético con capucha angular, máscara blindada, ojos de neón turquesa, armadura violeta, circuitos de código y bufanda verde lima en movimiento, sobre un escudo hexagonal oscuro.</desc>
  <defs>
    <linearGradient id="crx-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1840"/>
      <stop offset="1" stop-color="#080a14"/>
    </linearGradient>
    <linearGradient id="crx-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a98bff"/>
      <stop offset=".55" stop-color="#6d4dff"/>
      <stop offset="1" stop-color="#36e6ff"/>
    </linearGradient>
    <linearGradient id="crx-hood" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#3d3474"/>
      <stop offset=".5" stop-color="#231d47"/>
      <stop offset="1" stop-color="#110e24"/>
    </linearGradient>
    <linearGradient id="crx-armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9f86ff"/>
      <stop offset=".5" stop-color="#5b45c4"/>
      <stop offset="1" stop-color="#2a2163"/>
    </linearGradient>
    <linearGradient id="crx-armor-r" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f68f0"/>
      <stop offset=".5" stop-color="#43349c"/>
      <stop offset="1" stop-color="#1f1850"/>
    </linearGradient>
    <linearGradient id="crx-mask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4185"/>
      <stop offset="1" stop-color="#1b1638"/>
    </linearGradient>
    <linearGradient id="crx-suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1b3c"/>
      <stop offset="1" stop-color="#0b0b18"/>
    </linearGradient>
    <linearGradient id="crx-scarf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4ff8a"/>
      <stop offset=".5" stop-color="#7dff35"/>
      <stop offset="1" stop-color="#2fae12"/>
    </linearGradient>
    <linearGradient id="crx-eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#9ffcff"/>
      <stop offset="1" stop-color="#21d4f0"/>
    </linearGradient>
    <filter id="crx-glow" x="-60%" y="-120%" width="220%" height="340%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="crx-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="crx-clip">
      <path d="M128 6 L232 66 V190 L128 250 L24 190 V66 Z"/>
      <rect x="0" y="0" width="256" height="150"/>
    </clipPath>
  </defs>

  <!-- hex shield -->
  <path d="M128 12 L226 69 V187 L128 244 L30 187 V69 Z" fill="url(#crx-plate)" stroke="#05060d" stroke-width="6" stroke-linejoin="round"/>
  <path d="M128 12 L226 69 V187 L128 244 L30 187 V69 Z" fill="none" stroke="url(#crx-rim)" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M128 25 L215 75 V181 L128 231 L41 181 V75 Z" fill="none" stroke="#6d4dff" stroke-width="1.2" opacity=".45"/>
  <ellipse cx="128" cy="112" rx="70" ry="62" fill="#5b3cff" opacity=".35" filter="url(#crx-soft)"/>
  <g fill="none" stroke="#36e6ff" stroke-width="1.6" stroke-linecap="round" opacity=".5">
    <path d="M46 92 H60 L68 84 H76"/>
    <path d="M44 120 H56 L64 128"/>
    <path d="M210 92 H196 L188 84 H180"/>
    <path d="M212 120 H200 L192 128"/>
  </g>
  <g fill="#36e6ff" opacity=".7">
    <circle cx="46" cy="92" r="2.2"/><circle cx="44" cy="120" r="2.2"/>
    <circle cx="210" cy="92" r="2.2"/><circle cx="212" cy="120" r="2.2"/>
  </g>

  <!-- scarf tails (speed) -->
  <g stroke-linejoin="round">
    <path d="M168 166 L236 128 L224 148 L248 142 L218 170 L236 176 L174 194 Z" fill="url(#crx-scarf)" stroke="#05060d" stroke-width="4"/>
    <path d="M182 170 L228 142 M186 182 L234 152" stroke="#1d7a0c" stroke-width="2" opacity=".55" fill="none" stroke-linecap="round"/>
  </g>

  <g clip-path="url(#crx-clip)" stroke-linejoin="round">
    <!-- torso and shoulders -->
    <path d="M86 176 H170 L190 256 H66 Z" fill="url(#crx-suit)" stroke="#05060d" stroke-width="4"/>
    <path d="M24 214 L42 184 L90 166 L108 186 L92 256 H24 Z" fill="url(#crx-armor)" stroke="#05060d" stroke-width="4"/>
    <path d="M232 214 L214 184 L166 166 L148 186 L164 256 H232 Z" fill="url(#crx-armor-r)" stroke="#05060d" stroke-width="4"/>
    <path d="M44 188 L88 172 L100 186" fill="none" stroke="#cbbcff" stroke-width="2" opacity=".75" stroke-linecap="round"/>
    <path d="M212 188 L168 172 L156 186" fill="none" stroke="#36e6ff" stroke-width="2" opacity=".7" stroke-linecap="round"/>
    <path d="M40 214 L86 196 M216 214 L170 196" stroke="#110e24" stroke-width="3" opacity=".6"/>
    <!-- chest circuit -->
    <g fill="none" stroke="#36e6ff" stroke-width="2" stroke-linecap="round" opacity=".85">
      <path d="M128 200 V226 M128 212 H114 L106 220 M128 212 H142 L150 220"/>
    </g>
    <path d="M128 192 L136 200 L128 208 L120 200 Z" fill="#36e6ff" filter="url(#crx-glow)"/>

    <!-- scarf wrap -->
    <path d="M80 160 L128 176 L176 160 L182 180 L128 198 L74 180 Z" fill="url(#crx-scarf)" stroke="#05060d" stroke-width="4"/>
    <path d="M86 176 L128 189 L170 176" fill="none" stroke="#1d7a0c" stroke-width="2" opacity=".6"/>
  </g>

  <!-- hood -->
  <path d="M128 26 L168 38 L192 70 L198 110 L188 146 L164 170 L128 182 L92 170 L68 146 L58 110 L64 70 L88 38 Z" fill="url(#crx-hood)" stroke="#05060d" stroke-width="5"/>
  <path d="M128 30 L88 41 L66 72 L61 108" fill="none" stroke="#b9a6ff" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>
  <path d="M168 41 L189 72 L195 110 L186 144" fill="none" stroke="#36e6ff" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
  <path d="M128 30 V62" stroke="#0c0a1a" stroke-width="3" opacity=".7"/>
  <path d="M100 46 L84 78 M156 46 L172 78" stroke="#0c0a1a" stroke-width="2.4" opacity=".55" stroke-linecap="round"/>
  <!-- hood circuits -->
  <g fill="none" stroke="#36e6ff" stroke-width="1.6" stroke-linecap="round" opacity=".7">
    <path d="M74 132 V112 L80 104 V90"/>
    <path d="M182 132 V112 L176 104 V90"/>
  </g>
  <g fill="#36e6ff" opacity=".85">
    <circle cx="80" cy="90" r="2"/><circle cx="176" cy="90" r="2"/>
  </g>

  <!-- face opening -->
  <path d="M128 62 L162 72 L178 100 L176 132 L158 156 L128 166 L98 156 L80 132 L78 100 L94 72 Z" fill="#06070e"/>

  <!-- forehead plate -->
  <path d="M86 84 L128 72 L170 84 L166 98 L128 90 L90 98 Z" fill="url(#crx-armor)" stroke="#05060d" stroke-width="3"/>
  <path d="M90 86 L128 75 L166 86" fill="none" stroke="#e1d8ff" stroke-width="1.5" opacity=".7"/>
  <path d="M128 78 L135 84 L128 90 L121 84 Z" fill="#7dff35" stroke="#05060d" stroke-width="1.5"/>

  <!-- eyes -->
  <g filter="url(#crx-glow)">
    <path d="M90 104 L122 112 L119 121 L96 116 Z" fill="url(#crx-eye)"/>
    <path d="M166 104 L134 112 L137 121 L160 116 Z" fill="url(#crx-eye)"/>
  </g>

  <!-- mask -->
  <path d="M80 124 L104 126 L128 132 L152 126 L176 124 L172 140 L156 158 L128 170 L100 158 L84 140 Z" fill="url(#crx-mask)" stroke="#05060d" stroke-width="3.5"/>
  <path d="M128 133 V168" stroke="#0c0a1a" stroke-width="2.4"/>
  <path d="M84 127 L104 129 L127 135" fill="none" stroke="#b9a6ff" stroke-width="1.5" opacity=".7"/>
  <g stroke="#36e6ff" stroke-width="2.2" stroke-linecap="round" opacity=".9">
    <path d="M108 144 L118 148 M108 151 L118 155"/>
    <path d="M148 144 L138 148 M148 151 L138 155"/>
  </g>
</svg>
