services:
  daibot:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/daibot
      OVERLAY_DIR: /app/overlay
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Overlay montado en vivo: edita overlay/ y recarga el navegador.
      - ./overlay:/app/overlay
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: daibot
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daibot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
