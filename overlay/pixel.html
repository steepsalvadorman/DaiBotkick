<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920">
    <title>GorilinRix — Stream Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="/sio.js"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <main aria-label="Overlay del stream">
    <!-- Identidad del canal y métricas en vivo -->
    <div id="hud" aria-label="Estado del stream">
        <div class="brand-card">
            <div class="brand-mark" aria-hidden="true">GR</div>
            <div class="brand-copy">
                <span class="brand-kicker">TRANSMISIÓN EN DIRECTO</span>
                <div id="stream-title-display" class="stream-title" data-text="GORILINRIX">
            <span class="accent">GORILIN</span>RIX
                </div>
            </div>
        </div>
        <div class="live-badge"><span class="live-dot"></span><span>EN VIVO</span></div>
        <div class="stat-chip"><span class="label">AUDIENCIA</span><span class="val" id="viewers">--</span></div>
        <div class="stat-chip"><span class="label">EN DIRECTO</span><span class="val" id="uptime">00:00:00</span></div>
        <div class="stat-chip"><span class="label">SEGUIDORES</span><span class="val" id="followers-count">--</span></div>
    </div>

    <!-- Mensajes del chat -->
    <section id="chat-widget" aria-label="Chat en vivo">
        <div class="widget-heading">
            <span class="heading-mark" aria-hidden="true"></span>
            <span>CHAT EN VIVO</span>
            <span class="heading-live">ACTIVO</span>
        </div>
        <div class="chat-body" id="chat-messages"></div>
    </section>

    <!-- Alertas de la comunidad -->
    <section id="alert-box" aria-label="Alerta del stream" aria-live="polite">
        <div class="alert-header"><span class="alert-spark" aria-hidden="true">✦</span> NUEVA ALERTA</div>
        <div class="alert-body" id="alert-text"></div>
    </section>

    <!-- Música y solicitudes; no se muestra ninguna videocámara -->
    <section id="media-widget" aria-label="Música y solicitudes" style="opacity:0;transform:scale(0.9);visibility:hidden;">
        <div id="video-container">
            <div id="youtube-player"></div>
            <video id="direct-video" autoplay></video>
        </div>
        <div class="media-info">
            <div class="media-label"><span class="equalizer" aria-hidden="true"><i></i><i></i><i></i><i></i></span> AHORA SUENA</div>
            <div id="video-title">---</div>
            <div class="media-meta">
                <div class="requester-box">
                    <span class="requester-label">SOLICITADO POR</span>
                    <span id="video-requester">---</span>
                </div>
                <span id="queue-indicator"></span>
            </div>
        </div>
    </section>

    <!-- Consejos rotativos con comandos útiles -->
    <div id="tips" aria-label="Comandos y redes">
        <div class="tip"><span class="tip-label">PIDE MÚSICA</span>Escribe <b>!play</b> + link de YouTube</div>
        <div class="tip"><span class="tip-label">ENVÍA UN SALUDO</span><b>!dai</b> / <b>!dalia</b> / <b>!jorge</b> / <b>!alex</b> + texto</div>
        <div class="tip"><span class="tip-label">SÍGUENOS</span><b class="kick-channel-url">kick.com/seniordai</b></div>
    </div>
    </main>

    <script src="/app.js"></script>
</body>
</html>
