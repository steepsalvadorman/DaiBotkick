# Supply a persistent PostgreSQL database (Supabase or a paid managed database).
services:
  - type: web
    name: daibot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    numInstances: 1
    autoDeployTrigger: checksPass
    healthCheckPath: /readyz
    envVars:
      - key: KICK_CLIENT_ID
        sync: false
      - key: KICK_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BASE_URL
        sync: false
      - key: OVERLAY_DIR
        value: /app/overlay
      - key: TTS_CACHE_DIR
        value: /tmp/daibot_tts
      - key: RUST_LOG
        value: info
