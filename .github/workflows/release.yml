name: Build & Release DaiBot

on:
  push:
    tags:
      - 'v*'        # Se ejecuta al crear un tag como v1.0, v1.1, etc.
  workflow_dispatch: # Permite lanzarlo manualmente desde GitHub Actions

jobs:
  build-and-release:
    name: Build installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: backend/target
          key: rust-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: rust-

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress
        shell: powershell

      - name: Build Rust release
        run: cargo build --release
        working-directory: backend
        shell: powershell

      - name: Generate icon
        run: .\make_icon.ps1
        working-directory: installer
        shell: powershell
        continue-on-error: true

      - name: Setup Python portable + edge-tts
        working-directory: installer
        shell: powershell
        run: |
          $PyDir   = ".\python_portable"
          $EdgeTts = "$PyDir\Scripts\edge-tts.exe"
          if (-not (Test-Path $EdgeTts)) {
            $PyVersion = "3.12.9"
            $PyZip = "$env:TEMP\python-embed-amd64.zip"
            Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$PyVersion/python-$PyVersion-embed-amd64.zip" `
                              -OutFile $PyZip -UseBasicParsing
            Expand-Archive $PyZip -DestinationPath $PyDir
            $pthFile = Get-ChildItem $PyDir -Filter "python*._pth" | Select-Object -First 1
            $content = (Get-Content $pthFile.FullName -Raw) -replace '#import site', 'import site'
            [System.IO.File]::WriteAllText($pthFile.FullName, $content, [System.Text.Encoding]::ASCII)
            Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "$env:TEMP\get-pip.py" -UseBasicParsing
            & "$PyDir\python.exe" "$env:TEMP\get-pip.py" --no-warn-script-location --quiet
            & "$PyDir\python.exe" -m pip install edge-tts --no-warn-script-location --quiet
          }

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" DaiBot.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
        working-directory: installer
        shell: powershell

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DaiBot ${{ github.ref_name }}
          generate_release_notes: true
          files: installer/output/DaiBot.exe
          body: |
            ## DaiBot ${{ github.ref_name }}

            ### Instalacion
            1. Descarga `DaiBot.exe`
            2. Si Windows muestra **"Windows protegió su PC"** → clic en **Más información** → **Ejecutar de todas formas**
            3. Sigue el instalador — no requiere permisos de administrador
            4. Al terminar abre DaiBot desde el Escritorio e inicia sesion en Kick

            ### Overlay en OBS
            Browser Source → `http://localhost:3000/pixel.html` — 1920x1080
