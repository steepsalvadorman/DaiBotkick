<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920">
    <title>GorilinRix — Pixel Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <script src="/sio.js"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <!-- HUD — esquina superior izquierda, compacto -->
    <div id="hud">
        <div class="live-badge"><div class="live-dot"></div>LIVE</div>
        <div class="stat-chip"><span class="label">VIEWERS</span><span class="val" id="viewers">--</span></div>
        <div class="stat-chip"><span class="label">TIEMPO</span><span class="val" id="uptime">00:00:00</span></div>
        <div class="stat-chip"><span class="label">SEGUIDORES</span><span class="val" id="followers-count">--</span></div>
        <!-- El nombre del canal ya lo muestra Kick; se conserva para app.js -->
        <div id="stream-title-display" class="stream-title" data-text="GORILINRIX" hidden>
            <span class="accent">GORILIN</span>RIX
        </div>
    </div>

    <!-- CHAT — abajo a la izquierda, sin panel fijo; los mensajes se desvanecen solos -->
    <div id="chat-widget">
        <div class="chat-body" id="chat-messages"></div>
    </div>

    <!-- ALERTA — arriba al centro -->
    <div id="alert-box">
        <div class="alert-header">⚡ NUEVA ALERTA</div>
        <div class="alert-body" id="alert-text"></div>
    </div>

    <!-- MEDIA — solo aparece cuando hay video en cola -->
    <div id="media-widget" style="opacity:0;transform:scale(0.9);visibility:hidden;">
        <div id="video-container">
            <div id="youtube-player"></div>
            <video id="direct-video" autoplay></video>
        </div>
        <div class="media-info">
            <div class="media-label">▶ SONANDO</div>
            <div id="video-title">---</div>
            <div class="media-meta">
                <div class="requester-box">
                    <span class="requester-label">PEDIDO POR</span>
                    <span id="video-requester">---</span>
                </div>
                <span id="queue-indicator"></span>
            </div>
        </div>
    </div>

    <!-- AVISOS — abajo a la derecha, rotan sin desplazarse -->
    <div id="tips">
        <div class="tip">Escribe <b>!play</b> + link de YouTube para pedir una canción</div>
        <div class="tip">Escribe <b>!dai</b> / <b>!dalia</b> / <b>!jorge</b> / <b>!alex</b> + texto para TTS</div>
        <div class="tip">Síguenos en <b class="kick-channel-url">kick.com/seniordai</b></div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
