name: Validate DaiBot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daibot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/daibot_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: clippy,rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path backend/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path backend/Cargo.toml --locked
      - run: cargo test --manifest-path backend/Cargo.toml --locked -- --ignored
      - run: node --test tests/overlay.test.cjs
      - run: docker build -t daibot:ci .
